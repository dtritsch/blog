site_url: https://blog.treachtheword.com
display_url: https://blog.treachtheword.com

backend:
  name: github
  repo: dtritsch/blog
  branch: main
  site_domain: blog.treachtheword.com
  base_url: https://decap-oauth.delbert-tritsch.workers.dev
  squash_merges: true

publish_mode: editorial_workflow    # drafts become pull requests: Draft > In Review > Ready > Publish

locale: en

logo:
  src: https://blog.treachtheword.com/assets/images/logo-short.png
  show_in_header: true

media_folder: "assets/images/posts"
public_folder: "/assets/images/posts"

collections:
  - name: posts
    label: Posts
    label_singular: Post
    folder: _posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{year}}/{{month}}/{{title}}/"
    editor:
      preview: true
    fields:
      - label: Title
        name: title
        widget: string
      
      - label: "Publish Everywhere?"
        name: "published_everywhere"
        widget: "boolean"
        default: false
        hint: "Leave UNCHECKED to simulate a live preview. The post will be built at its direct hidden URL for verification. CHECK this field and republish to make it visible on the homepage and RSS feed."
      
      - label: "Hide From RSS"
        name: "jekyll-feed"
        widget: "hidden"
        default: { skip: true }

      - label: Author
        name: author
        widget: select
        options:
          - { label: Delbert Tritsch, value: delbert }
          - { label: Jennifer Tritsch, value: jennifer }

      - label: Date
        name: date
        widget: datetime
        format: "YYYY-MM-DD HH:mm:ss Z"   # includes the UTC offset so Jekyll never treats a new post as future-dated
        picker_utc: false
        hint: "Defaults to now. A date in the future hides the post until then."
      
      - label: Updated date
        name: last_modified_at
        widget: datetime
        required: false
        default: ""
        format: "YYYY-MM-DD HH:mm:ss Z"
        picker_utc: false
        hint: "Optional. Set this when you make a meaningful edit after publishing. Leave blank for new posts."

      - label: Summary
        name: description
        widget: text
        required: false
        hint: "Optional. Used on the home page list and as the search/social description. If blank, the first paragraph is used."

      - label: Share image
        name: image
        widget: image
        required: false
        hint: "Optional. Shown at the top of the post and in previews when it's shared. Best size: 1200 x 630. If blank, the post has no top image and the site default is used for previews."

      - label: Image description
        name: image_alt
        widget: string
        required: false
        hint: "Describe the image for screen readers. Leave blank if it is purely decorative."

      - label: Image credit
        name: image_credit
        widget: string
        required: false
        hint: "Optional. Leave blank to use the credit saved for this image under Image credits. HTML is allowed."

      - label: Store callout
        name: store_callout
        widget: object
        required: false
        collapsed: true
        summary: "{{fields.url}}"
        hint: "Optional box with a button at the end of the post. Leave the URL empty for no callout."
        fields:
          - { label: Text, name: text, widget: text, required: false }
          - { label: URL, name: url, widget: string, required: false }
          - { label: Button label, name: label, widget: string, required: false, default: "Visit the store" }
          - label: Product image
            name: image
            widget: image
            required: false
            hint: "Optional. A product photo, about 600px wide. Shows beside the text (above it on phones)."
          - label: Image description
            name: image_alt
            widget: string
            required: false
            hint: "Describe the image for screen readers, e.g. 'Black long sleeve tee with the Your life matters design'. Fill this in whenever you add an image."

      - label: Body
        name: body
        widget: markdown
        
  - name: image_credits
    label: Image credits
    files:
      - name: credits
        label: Image credits
        file: _data/image_credits.yml
        fields:
          - label: Credits
            name: credits
            widget: list
            label_singular: Credit
            fields:
              - { label: Image, name: image, widget: image }
              - label: Credit
                name: credit
                widget: string
                hint: 'HTML allowed, e.g. Photo by <a href="https://unsplash.com/@name">Name</a> on <a href="https://unsplash.com">Unsplash</a>'
