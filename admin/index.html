<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Content Manager | Treach the Word</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // Injects a clickable icon/link directly into the main table row views
    CMS.registerPreviewTemplate("posts", createClass({
      render: function() {
        var entry = this.props.entry;
        var title = entry.getIn(['data', 'title']) || "Untitled";
        var date = entry.getIn(['data', 'date']);
        var slug = entry.getIn(['slug']);

        if (!date) return h('div', {}, title);

        // Parse date for the URL structure /:year/:month/:slug/
        var d = new Date(date);
        var year = d.getFullYear();
        var month = String(d.getMonth() + 1).padStart(2, '0');
        var liveUrl = '/' + year + '/' + month + '/' + slug + '/';

        return h('div', { style: { display: 'flex', justifyContent: 'space-between', width: '100%' } },
          h('span', {}, title),
          h('a', { 
            href: liveUrl, 
            target: '_blank', 
            style: { color: '#0070f3', textDecoration: 'underline', marginLeft: '10px' },
            onClick: function(e) { e.stopPropagation(); } // Prevents row click from opening editor instead of link
          }, "🔗 Live Link")
        );
      }
    }));
  </script>
</body>
</html>
