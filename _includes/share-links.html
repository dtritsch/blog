{%- assign share_url = page.url | absolute_url -%}
{%- assign share_url_enc = share_url | url_encode -%}
{%- assign share_title_enc = page.title | url_encode -%}
<div class="share" data-url="{{ share_url }}" data-title="{{ page.title | escape }}">
  <h2 class="share__heading">Share this post</h2>
  <ul class="share__list">
    <li><a class="icon-link" href="https://www.facebook.com/sharer/sharer.php?u={{ share_url_enc }}" target="_blank" rel="noopener" aria-label="Share on Facebook" title="Share on Facebook"><span class="icon icon--facebook" aria-hidden="true"></span></a></li>
    <li><a class="icon-link" href="https://x.com/intent/post?url={{ share_url_enc }}&amp;text={{ share_title_enc }}" target="_blank" rel="noopener" aria-label="Share on X" title="Share on X"><span class="icon icon--x" aria-hidden="true"></span></a></li>
    <li><a class="icon-link" href="mailto:?subject={{ share_title_enc | replace: '+', '%20' }}&amp;body={{ share_url_enc }}" aria-label="Share by email" title="Share by email"><span class="icon icon--email" aria-hidden="true"></span></a></li>
    <li><button type="button" class="icon-link share__copy" aria-label="Copy link" title="Copy link" hidden><span class="icon icon--copy" aria-hidden="true"></span></button></li>
    <li><button type="button" class="icon-link share__native" aria-label="More sharing options" title="More sharing options" hidden><span class="icon icon--share" aria-hidden="true"></span></button></li>
  </ul>
  <p class="share__status" role="status" aria-live="polite"></p>
</div>
<script>
  (function () {
    var box = document.querySelector('.share');
    if (!box) return;
    var url = box.getAttribute('data-url');
    var title = box.getAttribute('data-title');
    var copy = box.querySelector('.share__copy');
    var more = box.querySelector('.share__native');
    var status = box.querySelector('.share__status');

    // Native share sheet (phones and some desktops): shows the person's own apps
    if (navigator.share) {
      more.hidden = false;
      more.addEventListener('click', function () {
        navigator.share({ title: title, url: url }).catch(function () {});
      });
    }

    // Copy link
    if (navigator.clipboard && navigator.clipboard.writeText) {
      copy.hidden = false;
      copy.addEventListener('click', function () {
        navigator.clipboard.writeText(url).then(function () {
          status.textContent = 'Link copied';
          setTimeout(function () { status.textContent = ''; }, 3000);
        });
      });
    }
  })();
</script>
