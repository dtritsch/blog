title: "Treach the Word"
tagline: "Teach the Word. Preach the Word. Treach the Word."
description: "The blog of Delbert and Jennifer Tritsch."
url: "https://blog.treachtheword.com"
baseurl: ""
timezone: America/Chicago
permalink: /:year/:month/:slug/

author:
  name: "Delbert and Jennifer Tritsch"

# Default picture for link previews when a post has no share image (1200 x 630).
image: /assets/images/social-default.png

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

collections:
  authors:
    output: true
    permalink: /authors/:name/
    
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "authors"
    values:
      layout: "author"